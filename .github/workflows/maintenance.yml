name: Backup and health
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scrollshow-maintenance
  cancel-in-progress: false
jobs:
  maintain:
    if: vars.PRODUCTION_AUTOMATIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Encrypted backup and queued media cleanup
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error --max-time 290 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://scrollshow.io/api/cron/maintenance
      - name: Check production health
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://scrollshow.io/api/health
