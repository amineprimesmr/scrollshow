# Vercel's Hobby plan caps crons at one run per day, which is too coarse to
# publish posts at their scheduled slot. This drives the same endpoint every
# 5 minutes. Set the CRON_SECRET repo secret to the value used on Vercel.
name: Publish scheduled posts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  publish:
    if: vars.PRODUCTION_AUTOMATIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger ScrollShow publish queue
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error --max-time 290 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://scrollshow.io/api/cron/publish
      - name: Check scheduler and backup freshness
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://scrollshow.io/api/health

  research:
    if: vars.PRODUCTION_AUTOMATIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Advance ScrollShow research queue
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error --max-time 250 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://scrollshow.io/api/cron/research
